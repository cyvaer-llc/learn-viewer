name: Unit Tests
on: push

jobs:
  ut-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Install
        run: npm ci
      - name: Test
        run: npm run test
